name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Majorsilence.Banish.slnx
      - run: dotnet build Majorsilence.Banish.slnx -c Release --no-restore
      - run: dotnet test tests/Majorsilence.Banish.Tests -c Release --no-build --verbosity normal

  # Starts PostgreSQL, SQL Server and MySQL in Docker; Linux runners only.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Majorsilence.Banish.Integration.Tests -c Release --verbosity normal
